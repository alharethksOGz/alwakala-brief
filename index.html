<style>
:root{
  --ink0:#141312;--ink:#1C1C1B;--paper:#EDEDEA;--card:#F7F7F5;
  --g1:#DCDCD7;--g2:#BDBDB8;--g3:#8C8C88;
  --m:#FF0A8C;--m2:#FF3AA3;--amber:#F2C46A;
  --ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --num:"Archivo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;background:var(--ink0);color:var(--paper);font-family:var(--ar);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
p,h1,h2{margin:0}
:focus-visible{outline:3px solid var(--m);outline-offset:3px}

/* ---------- the street ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--ink0)}
.stage picture,.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%}
.stage img,.stage video{object-fit:cover;object-position:50% 50%}
.stage video,.stage .lit{opacity:0}.stage video{transition:opacity .7s ease}
.stage video.on{opacity:1}
.stage .glow{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(255,200,120,.22),transparent 70%);mix-blend-mode:screen;pointer-events:none}
.stage .push{position:absolute;inset:0;animation:push 40s ease-in-out infinite alternate}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}
.veil{position:absolute;inset:0;background:
  radial-gradient(ellipse 72% 58% at 50% 44%,rgba(14,14,13,.62) 0%,rgba(14,14,13,.2) 62%,rgba(14,14,13,0) 80%),
  linear-gradient(to top,rgba(16,15,14,.9) 0%,rgba(16,15,14,.4) 38%,rgba(16,15,14,.18) 68%,rgba(16,15,14,.5) 100%)}


/* ---------- the gate ---------- */
.gate{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.panel{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:opacity .6s ease,transform .6s ease}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--g1);
  background:rgba(20,19,18,.55);border:1px solid rgba(247,247,245,.18);border-radius:999px;padding:6px 16px 6px 8px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kick b{background:var(--m);color:var(--ink);font-family:var(--num);font-weight:800;font-size:14px;border-radius:999px;padding:2px 11px}
.logo{margin:30px 0 0;width:min(600px,84vw)}
.logo svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 34px rgba(0,0,0,.5))}
.line{margin:6px 0 26px;font-size:clamp(22px,2.6vw,30px);line-height:1.5;font-weight:600;text-shadow:0 2px 18px rgba(0,0,0,.65)}
.prize{margin:22px 0 0;display:flex;align-items:baseline;justify-content:center;gap:12px;text-shadow:0 2px 18px rgba(0,0,0,.65)}
.prize .pv{font-family:var(--num);font-weight:800;font-size:clamp(56px,9vw,112px);line-height:1;color:var(--m);letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate}
.prize .pl{font-size:clamp(20px,2.4vw,30px);font-weight:700;color:var(--paper)}
.line b{display:block;color:var(--paper);font-weight:700}
form{width:min(470px,100%)}
label{display:block;margin-bottom:10px;font-size:17px;font-weight:600;color:var(--g1);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.field{display:flex;gap:8px;padding:6px;border-radius:999px;background:rgba(20,19,18,.66);border:1.5px solid rgba(247,247,245,.3);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .2s}
.field:focus-within{border-color:var(--m)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--card);text-align:center;
  font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.14em;text-transform:uppercase;padding:10px 8px}
.field input::placeholder{color:rgba(247,247,245,.3)}
.field button{flex:none;min-height:52px;padding:0 30px;border:0;border-radius:999px;background:var(--m);color:var(--ink);
  font-weight:800;font-size:18px;cursor:pointer;transition:background .2s}
.field button:hover{background:var(--m2)}
.field button[disabled]{cursor:progress;opacity:.8}
.cta{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.go{display:block;width:100%;min-height:56px;border:0;border-radius:999px;background:var(--m);color:var(--ink);font-weight:800;font-size:19px;cursor:pointer;text-decoration:none;line-height:56px;text-align:center;font-family:inherit;transition:background .2s}
.go:hover{background:var(--m2)}
.go.ghost{background:rgba(20,19,18,.55);color:var(--paper);border:1.5px solid rgba(247,247,245,.3);backdrop-filter:blur(8px)}
.msg{min-height:1.8em;margin-top:12px;font-size:16px;font-weight:600;color:#FFB8D9;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.hint{font-size:14px;color:var(--g2);text-shadow:0 1px 10px rgba(0,0,0,.7)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.panel{will-change:opacity,transform}
.nos{position:relative;z-index:3;margin:14px auto 0;font-size:17px;text-align:center}

/* ---------- scroll to light the street ---------- */
.track{position:relative;height:140vh}
.cue{margin-top:6px;font-size:14px;color:var(--g2);text-shadow:0 1px 10px rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;gap:4px}
.cue i{display:block;width:2px;height:30px;background:linear-gradient(var(--g1),transparent);animation:cue 1.6s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(6px);opacity:.5}}
.gate{position:sticky;top:0}
.fade{position:fixed;inset:0;z-index:20;background:var(--ink0);opacity:0;pointer-events:none;transition:opacity .45s ease}
.fade.on{opacity:1}

/* ---------- returning in the same session ---------- */
.bootmark{display:none;position:fixed;inset:0;z-index:30;place-items:center;background:var(--ink0)}
.bootmark svg{width:min(260px,56vw);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.boot .bootmark{display:grid}

bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .kick{font-size:13px}.kick b{font-size:12px}
  .logo{margin-top:24px}
  .line{margin:4px 0 22px}
  .field input{font-size:18px;letter-spacing:.1em}
  .field button{padding:0 20px;font-size:17px;min-height:48px}
}
@media (max-height:560px){.logo{width:min(420px,60vw);margin-top:16px}.line{margin:14px 0 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage" aria-hidden="true">
  <div class="push">
    <picture><source media="(max-aspect-ratio: 17/20)" srcset="assets/street-dark-9x16.jpg"><img id="still" src="assets/street-dark-16x9.jpg" alt="" fetchpriority="high"></picture>
    <video id="idle" muted loop playsinline preload="none" disablepictureinpicture disableremoteplayback></video>
    <picture><source media="(max-aspect-ratio: 17/20)" srcset="assets/street-lit-9x16.jpg"><img class="lit" id="lit" src="assets/street-lit-16x9.jpg" alt="" fetchpriority="low"></picture>
    <div class="glow" id="glow"></div>

</div>

<main class="gate">
  <div class="panel" id="panel">
    <p class="kick"><b>مسابقة</b><span>أفضل فكرة لإطلاق <bdi>الوكالة.ai</bdi></span></p>
    <h1 class="logo"><svg viewBox="0 0 500 144" role="img" aria-label="الوكالة"><use href="#wm"/></svg><span class="sr">الوكالة.ai</span></h1>
    <p class="prize"><span class="pv">130,000</span><span class="pl">ريال جوائز</span></p>
    <p class="line"><b>شارك واربح الآن.</b></p>
    <div class="cta">
      <a class="go" href="join.html" id="joinlink">شارك الآن</a>
      <button type="button" class="go ghost" id="go">اقرأ الـBrief</button>
      <a class="go ghost" href="gallery.html">شارع الأفكار</a>

  <noscript><p class="nos">هذي الصفحة تحتاج JavaScript. <a href="brief.html" style="color:var(--m)">افتح الـBrief مباشرة</a>.</p></noscript>

<script>
(function(){
'use strict';
if(window.CH){CH.track();var _m=CH.me();if(_m){var jl=document.getElementById('joinlink');if(jl){jl.textContent='مشروعي · '+(_m.name||'').split(' ')[0];jl.href='submit.html'}}document.getElementById('joinlink').addEventListener('click',function(){CH.event('landing_join')})}
var A='assets/';var $=function(s){return document.getElementById(s)};var doc=document.documentElement;
var RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var O=(window.matchMedia&&matchMedia('(max-aspect-ratio: 17/20)').matches)?'9x16':'16x9';
var idle=$('idle'),lit=$('lit'),glow=$('glow'),veil=document.querySelector('.veil'),panel=$('panel'),fade=$('fade');
var gone=false,auto=null;
function clamp(v){return Math.max(0,Math.min(1,v))}
function ease(t){return 1-Math.pow(1-t,3)}
function maxY(){return Math.max(1,doc.scrollHeight-window.innerHeight)}
function go(){if(gone)return;gone=true;if(window.CH)CH.event('landing_enter');fade.classList.add('on');setTimeout(function(){location.href='brief.html'},RM?0:450)}
function frame(){var p=clamp(window.scrollY/maxY()),t=ease(p);
  lit.style.opacity=t.toFixed(3);glow.style.opacity=(t*(1-t)*2.2).toFixed(3);veil.style.opacity=(1-.7*t).toFixed(3);
  var f=clamp(p/.55);panel.style.opacity=(1-f).toFixed(3);panel.style.transform='translateY('+(-24*f).toFixed(1)+'px)';panel.style.pointerEvents=f>.6?'none':'auto';
  if(p>=.985)go()}
var tick=false;window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(function(){tick=false;frame()})}},{passive:true});window.addEventListener('resize',frame);
function autoScroll(){if(auto||gone)return;var y0=window.scrollY,y1=maxY(),t0=null,D=RM?0:2600;
  function step(ts){if(!t0)t0=ts;var k=D?clamp((ts-t0)/D):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;window.scrollTo(0,y0+(y1-y0)*e);frame();if(k<1&&auto)auto=requestAnimationFrame(step);else{auto=null;go()}}
  auto=requestAnimationFrame(step)}
['wheel','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,function(){if(auto){cancelAnimationFrame(auto);auto=null}},{passive:true})});
$('go').addEventListener('click',function(){if(window.CH)CH.event('landing_go');autoScroll()});
document.addEventListener('visibilitychange',function(){if(document.hidden||!idle.src||!idle.paused)return;var p=idle.play();if(p&&p.catch)p.catch(function(){})});
if(!RM){idle.src=A+'street-idle-'+O+'.mp4';idle.addEventListener('playing',function(){idle.classList.add('on')},{once:true});var p=idle.play();if(p&&p.catch)p.catch(function(){})}
if(window.scrollY>0)window.scrollTo(0,0);frame();
/* live counter */
fetch('https://xpjxnksnqmynqueddinf.supabase.co/rest/v1/rpc/chal_stats',{method:'POST',headers:{apikey:'sb_publishable_5e-Vx3e9vlEdi3ydhh-0pw_7W8M6sOo',Authorization:'Bearer sb_publishable_5e-Vx3e9vlEdi3ydhh-0pw_7W8M6sOo','Content-Type':'application/json'},body:'{}'})
  .then(function(r){return r.json()}).then(function(s){var n=+s.registered||0,m=+s.approved||0;var d=Math.max(0,Math.ceil((new Date(s.deadline)-Date.now())/864e5));
    $('cnt').innerHTML=(n?'<b>'+n.toLocaleString('en-US')+'</b> مشارك سجّل':'كن أول من يسجّل')+(m?' · <b>'+m+'</b> مشروع في الشارع':'')+' · باقي <b>'+d+'</b> يوم للتقديم'}).catch(function(){$('cnt').textContent=''});
doc.classList.remove('boot');
})();
</script>
