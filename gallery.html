<style>
:root{--ink0:#141312;--ink:#1C1C1B;--paper:#EDEDEA;--g1:#DCDCD7;--g2:#BDBDB8;--g3:#8C8C88;--m:#FF0A8C;--grn:#2E9E6B;--line:#3C3C39;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink0);color:var(--paper);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background-image:radial-gradient(circle,#2A2A27 1px,transparent 1.35px);background-size:28px 28px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(20,19,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar svg{width:84px;height:auto}
.bar .sp{flex:1}
.bar a,.tab{color:var(--paper);text-decoration:none;font-weight:700;font-size:15px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:transparent;font-family:inherit;cursor:pointer}
.bar a.m{background:var(--m);color:var(--ink);border-color:var(--m)}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:clamp(28px,4vw,44px);margin:0 0 6px}h1 b{color:var(--m)}
.sub{color:var(--g2);margin:0 0 20px;font-size:17px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--ink);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.fr{position:relative;aspect-ratio:9/16;background:#0c0c0b;cursor:pointer}
.fr video,.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr .play{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(20,19,18,.75);border:1.5px solid rgba(247,247,245,.4);transform:translate(-50%,-50%);pointer-events:none}
.fr .play::after{content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);border-left:16px solid #EDEDEA;border-top:10px solid transparent;border-bottom:10px solid transparent}
.fr.on .play{display:none}
.fr.doc{display:grid;place-items:center;cursor:default;background:linear-gradient(160deg,#1C1C1B,#0c0c0b)}.fr.doc span{border:1.5px solid var(--m);color:var(--m);border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px}
.meta{padding:12px 14px 14px}
.meta b{display:block;font-size:16px;line-height:1.5}
.meta .who{font-size:13px;color:var(--g3);margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.vote{border:1.5px solid var(--m);background:transparent;color:var(--paper);border-radius:999px;padding:6px 14px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.vote[aria-pressed="true"],.vote:hover{background:var(--m);color:var(--ink)}
.vote i{font-style:normal;font-family:Archivo,sans-serif;margin-inline-start:6px}
.ext{font-size:13px;color:var(--g2);text-decoration:none}
.empty{color:var(--g2);text-align:center;padding:60px 20px;border:1.5px dashed var(--line);border-radius:22px;font-size:18px}
.empty a{color:var(--m)}
.foot{margin-top:26px;color:var(--g3);font-size:13px;text-align:center}
</style>

  <p class="sub" id="sub">أفكار المشاركين في تحدي «أشعلوا الشارع»: فيديو أو مقترح. شوف، وصوّت لفكرة واحدة تستاهل. التصويت مفتوح حتى 24 أكتوبر.</p>

<script>
(function(){
var SB='https://xpjxnksnqmynqueddinf.supabase.co',KEY='sb_publishable_5e-Vx3e9vlEdi3ydhh-0pw_7W8M6sOo';
var $=function(s){return document.querySelector(s)};var items=[],sort='new',dev;
try{dev=localStorage.getItem('aw_dev');if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():String(Math.random())).replace(/-/g,'').slice(0,16);localStorage.setItem('aw_dev',dev)}}catch(e){dev='nodev'}
var voted={};try{voted=JSON.parse(localStorage.getItem('aw_votes')||'{}')}catch(e){}
function rpc(n,b){return fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){return r.json()})}
function pub(p){return SB+'/storage/v1/object/public/challenge-video/'+p}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){var g=$('#grid');var list=items.slice();if(sort==='top')list.sort(function(a,b){return b.votes-a.votes});
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">الشارع فاضي لسا. <a href="brief.html#c4">كن أول من يضيء نافذة.</a></div>';return}
  g.innerHTML=list.map(function(x){return '<div class="card">'+(x.video?'<div class="fr" data-id="'+x.id+'">'+(x.poster?'<img loading="lazy" src="'+pub(x.poster)+'" alt="">':'<video preload="metadata" src="'+pub(x.video)+'#t=0.5" muted playsinline></video>')+'<span class="play"></span></div>':'<div class="fr doc"><span>مقترح مكتوب</span></div>')
    +'<div class="meta"><b>'+esc(x.title||'بدون عنوان')+'</b><div class="who">'+esc(x.name)+(x.handle?' · <bdi>'+esc(x.handle)+'</bdi>':'')+(x.city?' · '+esc(x.city):'')+'</div>'
    +'<div class="row"><button class="vote" data-id="'+x.id+'" aria-pressed="'+(voted[x.id]?'true':'false')+'">صوّت<i>'+x.votes+'</i></button>'+(x.reel_url?'<a class="ext" href="'+esc(x.reel_url)+'" target="_blank" rel="noopener">على حسابه ↗</a>':'')+'</div></div></div>'}).join('')}
$('#grid').addEventListener('click',function(e){var fr=e.target.closest('.fr:not(.doc)');if(fr){var id=fr.dataset.id,x=items.find(function(i){return i.id===id});var v=fr.querySelector('video');
    document.querySelectorAll('.fr video').forEach(function(o){if(o!==v){o.pause();o.parentNode.classList.remove('on')}});
    if(!v){v=document.createElement('video');v.src=pub(x.video);v.playsInline=true;v.controls=true;v.autoplay=true;fr.innerHTML='';fr.appendChild(v);fr.classList.add('on');return}
    if(v.paused){v.controls=true;v.muted=false;v.play();fr.classList.add('on')}else{v.pause();fr.classList.remove('on')}return}
  var b=e.target.closest('.vote');if(b){var id=b.dataset.id;if(voted[id])return;b.disabled=true;
    rpc('chal_vote',{p_entry:id,p_device:dev}).then(function(r){if(r&&r.ok){voted[id]=1;try{localStorage.setItem('aw_votes',JSON.stringify(voted))}catch(x){}var it=items.find(function(i){return i.id===id});if(it)it.votes=r.votes;render()}else{b.disabled=false;if(r&&r.message&&r.message.indexOf('closed')>=0)alert('انتهى التصويت.')}}).catch(function(){b.disabled=false})}});
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){sort=t.dataset.s;document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-pressed',x===t)});render()})});
rpc('chal_gallery').then(function(l){items=Array.isArray(l)?l:[];render()}).catch(function(){$('#grid').innerHTML='<div class="empty" style="grid-column:1/-1">تعذّر تحميل الشارع. جرّب بعد شوي.</div>'});
})();
